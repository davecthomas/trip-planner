# =============================================================================
# Meta / vehicle
# =============================================================================

meta:
  title: "San Diego → Austin"
  version_label: "v15 · Tesla MYP · 69 mph"
  agenda_label: "Full Trip Agenda · v15"
  default_plan: "A"
  storage_prefix: "sd-austin"

# §3 consumption envelope per spec §3.1–§3.3. Constants here drive the
# runtime §3.4 AC conservation indicator. To use a different EV, change
# every value in this block (and the per-stop elevation_ft) — no other
# code changes needed.
vehicle:
  name: "Tesla Model Y Performance"
  make: "Tesla"
  model: "Model Y Performance"
  year: 2024
  wheels: '21" Überturbine'
  notes: >-
    Stock aero (no roof box). ~605 lb payload (2 adults + 2 ~60 lb dogs +
    ~200 lb gear). Cruise 69 mph + 5% drive-time allowance.

  # Pack + budget
  usable_pack_kwh: 75
  reserve_soc_pct: 20

  # Consumption (per §3.3)
  baseline_wh_per_mi: 330
  ac_penalty_wh_per_mi: 30
  ac_window_start: "10:00"
  ac_window_end: "18:00"
  climb_kwh_per_1000ft: 2.35
  regen_recovery: 0.65

  # §3.4 AC indicator thresholds
  ac_indicator_arrival_threshold_pct: 25
  ac_indicator_min_improvement_pp: 3

