# =============================================================================
# San Diego → Austin · EV Road Trip
#
# Sample trip for the trip-planner engine. Captures the v14 spec as a
# YAML document. Three plan variants (A, B, C) are maintained
# in parallel for in-trip plan switching.
#
# Reusable place definitions live under `_aliases` at the top — the loader
# drops that key before validation; the YAML parser resolves anchors at
# parse time, so each `<<: *anchor` in a stop expands inline.
# =============================================================================

_aliases:
  # ---------------- Endpoints ----------------
  # Endpoints are public landmarks (City Hall to City Hall) so the sample
  # routes to real, real-world locations without exposing anyone's home
  # address. Swap these anchors in your own local copy for a private trip.
  # elevation_ft per stop powers the §3.4 AC conservation indicator
  # (climbing legs raise consumption Wh/mi).
  - &place_origin
    name: "San Diego City Hall"
    address: "202 C St, San Diego CA 92101"
    lat: 32.7174
    lng: -117.1628
    elevation_ft: 50
  - &place_dest
    name: "Austin City Hall"
    address: "301 W 2nd St, Austin TX 78701"
    lat: 30.2655
    lng: -97.7470
    elevation_ft: 470

