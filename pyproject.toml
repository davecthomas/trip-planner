[tool.poetry]
name = "trip-planner"
version = "0.1.0"
description = "Render a single-page, self-contained HTML itinerary from a YAML trip specification."
authors = ["Dave Thomas <davidcthomas@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "trip_planner", from = "src" }]
repository = "https://github.com/davecthomas/trip-planner"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
pyyaml = "^6.0"
jinja2 = "^3.1"
click = "^8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"

[tool.poetry.scripts]
trip-planner = "trip_planner.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["trip_planner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
